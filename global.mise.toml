[env]
EDITOR='nvim'

# This is the GENERAL workspace config (~/projects). It is shared with sibling projects
# (data-platform, onsite-ocr), so it deliberately holds NO project secrets and NO [tools] —
# only cross-cutting tasks for managing git worktrees, agents, and dev sessions.
#
# The tasks are project-agnostic: they resolve "which project am I in?" from where you run
# them (MISE_ORIGINAL_CWD) via `git --git-common-dir`, which points back to the project's
# main checkout from any checkout/worktree/subdir. A project can declare specifics in its
# own mise.toml that these tasks read:
#   - WORKTREE_HOME : worktrees dir relative to ~/projects (default: "worktrees/<project>")
#   - a `worktree_setup` task : per-worktree wiring (symlinks etc.), called after creation
# (edrolo declares both in ~/projects/shared/edrolo.mise.toml.)

#
# Worktrees
#

[tasks.add_worktree]
description = "Create a git worktree for the current project"
usage = '''
arg "<branch>" help="Branch to create a worktree from"
complete "branch" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" branch -r --format='%(refname:short)' | sed 's|^origin/||') | sort -u"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"

BRANCH="{{ usage.branch }}"
DIR_NAME=$(echo "$BRANCH" | tr '/' '-')
WORKTREE_PATH="$WORKTREES_DIR/$DIR_NAME"
mkdir -p "$WORKTREES_DIR"
GIT="git -C $ROOT"
if $GIT branch --list "$BRANCH" | grep -q .; then
  $GIT worktree add "$WORKTREE_PATH" "$BRANCH"
else
  $GIT worktree add "$WORKTREE_PATH" -b "$BRANCH"
fi

# Run the project's worktree-setup hook if it defines one (edrolo: symlinks + per-checkout config).
if mise -C "$ROOT" task info worktree_setup >/dev/null 2>&1; then
  mise -C "$ROOT" run worktree_setup "$WORKTREE_PATH"
fi
"""

[tasks.remove_worktree]
description = "Remove a git worktree of the current project"
usage = '''
arg "<branch>" help="Worktree to remove"
complete "branch" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename 2>/dev/null"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"
git -C "$ROOT" worktree remove --force "$WORKTREES_DIR/{{ usage.branch }}"
"""

[tasks.list_worktrees]
description = "List git worktrees of the current project"
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
git -C "$ROOT" worktree list
"""

[tasks.clean_worktrees]
description = "Flag stale or merged worktrees of the current project and remove them on confirmation"
usage = '''
flag "--days <days>" default="14" help="Flag worktrees unused for more than this many days"
flag "--force" help="Also remove worktrees with uncommitted or untracked changes"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
DAYS="{{ usage.days }}"
FORCE="{{ usage.force }}"
HERE=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --show-toplevel)
G="git -C $ROOT"

# --prune drops remote-tracking refs for deleted branches, which "upstream deleted" relies on.
$G fetch --prune --quiet origin 2>/dev/null || echo "Warning: fetch failed; merge checks use possibly stale refs." >&2
BASE=$($G symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null || echo master)

NOW=$(date +%s)
FLAGGED=$(mktemp)
trap 'rm -f "$FLAGGED"' EXIT

# Porcelain records are blank-line separated; the first is the main checkout.
$G worktree list --porcelain | awk '
  /^worktree / { path = substr($0, 10); branch = ""; locked = 0 }
  /^branch /   { branch = substr($0, 19) }
  /^locked/    { locked = 1 }
  /^$/         { if (n++ && !locked) print path "|" branch; path = "" }
  END          { if (path != "" && n++ && !locked) print path "|" branch }
' > "$FLAGGED.all"
echo "Checking $(wc -l < "$FLAGGED.all" | tr -d ' ') worktrees against $BASE..."

while IFS='|' read -r path branch; do
  [ "$path" = "$HERE" ] && continue
  reasons=""
  merged=""
  dirty=""
  if [ ! -d "$path" ]; then
    reasons="directory missing"
  else
    # Last use: newest of the HEAD commit, the index (rewritten by status/add/checkout) and
    # the HEAD reflog (commits, checkouts, resets).
    last=$(git -C "$path" log -1 --format=%ct HEAD)
    GD=$(git -C "$path" rev-parse --absolute-git-dir)
    for f in "$GD/index" "$GD/logs/HEAD"; do
      [ -e "$f" ] || continue
      m=$(stat -f %m "$f")
      [ "$m" -gt "$last" ] && last=$m
    done
    age=$(( (NOW - last) / 86400 ))
    [ "$age" -gt "$DAYS" ] && reasons="unused ${age}d"
    # --no-optional-locks: a plain status refreshes the index, which would reset its mtime.
    [ -n "$(git -C "$path" --no-optional-locks status --porcelain | head -1)" ] && dirty=1
  fi

  if [ -n "$branch" ]; then
    tip=$($G rev-parse "refs/heads/$branch")
    created=$($G reflog show --format=%H "refs/heads/$branch" 2>/dev/null | tail -1)
    # A branch with no commits since creation is trivially an ancestor of BASE; that is
    # not a merge.
    if [ "$tip" != "$created" ]; then
      if $G merge-base --is-ancestor "$tip" "$BASE"; then
        merged="merged into $BASE"
      else
        # Squash merges leave no ancestry. Collapse the branch into one commit on its
        # merge-base and ask git cherry whether BASE already has an equivalent patch.
        mb=$($G merge-base "$tip" "$BASE" || true)
        if [ -n "$mb" ]; then
          probe=$($G commit-tree "$tip^{tree}" -p "$mb" -m probe)
          case $($G cherry "$BASE" "$probe") in -*) merged="squash-merged into $BASE" ;; esac
        fi
      fi
    fi
    if [ "$($G for-each-ref --format='%(upstream:track)' "refs/heads/$branch")" = "[gone]" ]; then
      merged="${merged:+$merged, }upstream deleted"
    fi
  fi

  if [ -n "$merged" ]; then
    reasons="${reasons:+$reasons, }$merged"
  fi
  [ -n "$reasons" ] && echo "$path|$branch|$reasons|$merged|$dirty" >> "$FLAGGED"
done < "$FLAGGED.all"
rm -f "$FLAGGED.all"

if [ ! -s "$FLAGGED" ]; then
  echo "Nothing to clean up."
  exit 0
fi

echo
{
  echo "WORKTREE|BRANCH|REASON|ACTION"
  while IFS='|' read -r path branch reasons merged dirty; do
    if [ -n "$dirty" ] && [ "$FORCE" != "true" ]; then
      action="skip: uncommitted changes (use --force)"
    elif [ -n "$merged" ] && [ -n "$branch" ]; then
      action="remove worktree + branch"
    else
      action="remove worktree, keep branch"
    fi
    [ -n "$dirty" ] && [ "$FORCE" = "true" ] && action="$action (discards changes)"
    echo "$(basename "$path")|${branch:-detached}|$reasons|$action"
  done < "$FLAGGED"
} | column -t -s '|'
echo

TOTAL=$(wc -l < "$FLAGGED" | tr -d ' ')
SKIP=0
[ "$FORCE" != "true" ] && SKIP=$(awk -F'|' '$5 != ""' "$FLAGGED" | wc -l | tr -d ' ')
if [ $((TOTAL - SKIP)) -eq 0 ]; then
  echo "All flagged worktrees have uncommitted changes; rerun with --force to remove them."
  exit 0
fi
if ! ( : < /dev/tty ) 2>/dev/null; then
  echo "Error: confirmation needs a terminal; nothing removed." >&2
  exit 1
fi
printf 'Remove %s worktree(s)? [y/N] ' "$((TOTAL - SKIP))"
read -r answer < /dev/tty || answer=""
case "$answer" in
  y|Y|yes|YES) ;;
  *) echo "Aborted; nothing removed."; exit 0 ;;
esac

while IFS='|' read -r path branch reasons merged dirty; do
  if [ -n "$dirty" ] && [ "$FORCE" != "true" ]; then
    continue
  fi
  if [ -d "$path" ]; then
    # Cleanliness was checked during the scan; --force here only matters for dirty
    # worktrees the user opted into, and submodules.
    $G worktree remove --force "$path"
  else
    $G worktree prune
  fi
  echo "removed $(basename "$path")"
  # -D: squash-merged branches aren't ancestors of BASE, so -d would refuse them.
  if [ -n "$merged" ] && [ -n "$branch" ]; then
    $G branch -D "$branch" >/dev/null && echo "  deleted branch $branch"
  fi
done < "$FLAGGED"
"""

#
# Agents
#

[tasks.spawn_agent]
description = "Spawn a Claude Code agent in a herdr workspace for a worktree"
usage = '''
arg "<worktree>" help="Worktree/branch to spawn an agent into"
complete "worktree" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename) | sort -u"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"

if [ -z "${HERDR_ENV:-}" ]; then
  echo "Error: spawn_agent must be run from inside a herdr session." >&2
  exit 1
fi

WORKTREE="{{ usage.worktree }}"
DIR_NAME=$(echo "$WORKTREE" | tr '/' '-')
WORKTREE_PATH="$WORKTREES_DIR/$DIR_NAME"
if [ ! -d "$WORKTREE_PATH" ]; then
  ( cd "$ROOT" && mise run add_worktree "$WORKTREE" )
fi

# One workspace per worktree, labelled by worktree name. herdr is agent-aware, so the
# agent's live state (working/blocked/done) shows in the sidebar. --no-focus creates it
# in the background (like tmux's detached new-window). Grab the root pane id from the
# create response and launch claude into it with `pane run` (atomic submit, no send-keys).
PANE=$(herdr workspace create --cwd "$WORKTREE_PATH" --label "$DIR_NAME" --no-focus \
  | jq -r '.result.root_pane.pane_id')
# `mise exec` applies the project's env (e.g. ANTHROPIC_API_KEY) + tools to claude.
herdr pane run "$PANE" "mise exec -- claude"
"""

[tasks.kill_agent]
description = "Close the herdr workspace running the agent for a worktree"
usage = '''
arg "<worktree>" help="Worktree whose agent workspace to close"
complete "worktree" run="herdr workspace list 2>/dev/null | jq -r '.result.workspaces[].label' | sort -u"
'''
run = """
set -eu
WORKTREE="{{ usage.worktree }}"
DIR_NAME=$(echo "$WORKTREE" | tr '/' '-')

# Resolve the workspace id by label so it works regardless of what we're attached to.
TARGET=$(herdr workspace list | jq -r --arg n "$DIR_NAME" \
  'first(.result.workspaces[] | select(.label == $n) | .workspace_id) // empty')
if [ -z "$TARGET" ]; then
  echo "No agent workspace labelled '$DIR_NAME' found." >&2
  exit 1
fi
herdr workspace close "$TARGET"
"""

#
# Dev
#

[tasks.dev]
description = "Open a herdr dev workspace for a project/worktree"
usage = '''
arg "[worktree]" help="Worktree to work in (defaults to the project's main checkout)"
complete "worktree" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename) | sort -u"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"

WORKTREE="{{ usage.worktree }}"
if [ -z "$WORKTREE" ]; then
  # No worktree given → the project's main checkout.
  WORKTREE_PATH="$ROOT"
  LABEL="$PROJECT"
else
  LABEL=$(echo "$WORKTREE" | tr '/' '-')
  WORKTREE_PATH="$WORKTREES_DIR/$LABEL"
  if [ ! -d "$WORKTREE_PATH" ]; then
    ( cd "$ROOT" && mise run add_worktree "$WORKTREE" )
  fi
fi

mise run herdr_server default

# Reuse an existing dev workspace for this target rather than clobbering it. The workspace
# has a single tab: a plain shell cwd'd in the worktree (mise activates via the shell rc, so
# the project env is live). Launch the agent yourself with `claude` once attached.
WS=$(herdr workspace list | jq -r --arg n "$LABEL" \
  'first(.result.workspaces[] | select(.label == $n) | .workspace_id) // empty')
if [ -z "$WS" ]; then
  CREATE=$(herdr workspace create --cwd "$WORKTREE_PATH" --label "$LABEL" --no-focus)
  WS=$(echo "$CREATE" | jq -r '.result.workspace.workspace_id')
  herdr tab rename "$(echo "$CREATE" | jq -r '.result.tab.tab_id')" agent >/dev/null
fi
herdr workspace focus "$WS" >/dev/null

# Attach this terminal to the session, unless we're already inside a herdr client — in that
# case the focus above already switched the view.
if [ -z "${HERDR_ENV:-}" ]; then
  herdr session attach default
fi
"""

#
# Herdr
#

[tasks.herdr_server]
description = "Ensure a headless herdr server is running for a session"
hide = true
usage = '''
arg "<session>" help="herdr session name"
'''
run = """
set -eu
SESSION="{{ usage.session }}"
running() { herdr --session "$SESSION" status server 2>/dev/null | grep -q 'status: running'; }
running && exit 0
# Start from a clean login env. Panes inherit the server's env, so starting it with this
# task's env (mise state, a project's [env], tool PATHs) would leak into every pane and
# stop `mise activate` there from tracking the pane's own directory.
env -i HOME="$HOME" USER="$USER" LOGNAME="${LOGNAME:-$USER}" SHELL="${SHELL:-/bin/zsh}" \\
  TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-en_US.UTF-8}" SSH_AUTH_SOCK="${SSH_AUTH_SOCK:-}" \\
  /bin/zsh -lc 'nohup herdr --session "$1" server >/dev/null 2>&1 &' _ "$SESSION"
for _ in $(seq 1 50); do
  running && exit 0
  sleep 0.1
done
echo "Error: herdr server for session '$SESSION' did not start." >&2
exit 1
"""

#
# App
#

# The Edrolo app stack runs in its own herdr session (edrolo-app), one tab per service.
# Services bind fixed ports, so only one checkout's stack runs at a time.

[tasks.start_edrolo]
description = "Start the Edrolo app stack for a worktree in the edrolo-app herdr session"
usage = '''
arg "[worktree]" help="Worktree to run (defaults to the main checkout)"
complete "worktree" run="R=$HOME/projects/edrolo; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename) | sort -u"
'''
run = """
set -eu
SESSION=edrolo-app
ROOT="$MISE_CONFIG_ROOT/edrolo"
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/edrolo}"

WORKTREE="{{ usage.worktree }}"
if [ -z "$WORKTREE" ]; then
  WORKTREE_PATH="$ROOT"
  LABEL=edrolo
else
  LABEL=$(echo "$WORKTREE" | tr '/' '-')
  WORKTREE_PATH="$WORKTREES_DIR/$LABEL"
  if [ ! -d "$WORKTREE_PATH" ]; then
    ( cd "$ROOT" && mise run add_worktree "$WORKTREE" )
  fi
fi
if [ ! -d "$WORKTREE_PATH/tod_project" ]; then
  echo "Error: not an Edrolo checkout (no tod_project under '$WORKTREE_PATH')." >&2
  exit 1
fi

mise run herdr_server "$SESSION"
H="herdr --session $SESSION"
OLD=$($H workspace list | jq -r '.result.workspaces[].workspace_id')

# label|cwd|command. The first service takes the workspace's initial tab.
SERVICES="docker|$HOME|lazydocker
django|$WORKTREE_PATH/tod_project|mise exec -- ./manage.py runserver
vite|$WORKTREE_PATH/tod_project/frontend|pnpm dev:no-gen
react|$WORKTREE_PATH/tod_project/tod_django/react|yarn install && yarn run dev"

WS=
while IFS='|' read -r label cwd cmd; do
  if [ -z "$WS" ]; then
    CREATE=$($H workspace create --cwd "$cwd" --label "$LABEL" --no-focus)
    WS=$(echo "$CREATE" | jq -r '.result.workspace.workspace_id')
    $H tab rename "$(echo "$CREATE" | jq -r '.result.tab.tab_id')" "$label" >/dev/null
    PANE=$(echo "$CREATE" | jq -r '.result.root_pane.pane_id')
  else
    PANE=$($H tab create --workspace "$WS" --cwd "$cwd" --label "$label" --no-focus \\
      | jq -r '.result.root_pane.pane_id')
  fi
  $H pane run "$PANE" "$cmd"
  echo "started $label ($LABEL)"
done <<EOF
$SERVICES
EOF

# Close the previous stack only after the new workspace exists, so the session never
# drops to zero workspaces.
for w in $OLD; do $H workspace close "$w" >/dev/null 2>&1 || true; done
$H workspace focus "$WS" >/dev/null

if [ -z "${HERDR_ENV:-}" ]; then
  herdr session attach "$SESSION"
else
  echo "Attach with: herdr session attach $SESSION"
fi
"""

[tasks.stop_edrolo]
description = "Stop the Edrolo app stack (the edrolo-app herdr session)"
run = """
set -eu
if herdr session list | awk '$1 == "edrolo-app" && $2 == "running" { found = 1 } END { exit !found }'; then
  herdr session stop edrolo-app
else
  echo "edrolo-app is not running."
fi
"""
