[env]
EDITOR='nvim'

# This is the GENERAL workspace config (~/projects). It is shared with sibling projects
# (data-platform, onsite-ocr), so it deliberately holds NO project secrets and NO [tools] —
# only cross-cutting tasks for managing git worktrees, agents, and dev sessions.
#
# The tasks are project-agnostic: they resolve "which project am I in?" from where you run
# them (MISE_ORIGINAL_CWD) via `git --git-common-dir`, which points back to the project's
# main checkout from any checkout/worktree/subdir. A project can declare specifics in its
# own mise.toml that these tasks read:
#   - WORKTREE_HOME : worktrees dir relative to ~/projects (default: "worktrees/<project>")
#   - a `worktree_setup` task : per-worktree wiring (symlinks etc.), called after creation
# (edrolo declares both in ~/projects/shared/edrolo.mise.toml.)

#
# Worktrees
#

[tasks.add_worktree]
description = "Create a git worktree for the current project"
usage = '''
arg "<branch>" help="Branch to create a worktree from"
complete "branch" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" branch -r --format='%(refname:short)' | sed 's|^origin/||') | sort -u"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"

BRANCH="{{ usage.branch }}"
DIR_NAME=$(echo "$BRANCH" | tr '/' '-')
WORKTREE_PATH="$WORKTREES_DIR/$DIR_NAME"
mkdir -p "$WORKTREES_DIR"
GIT="git -C $ROOT"
if $GIT branch --list "$BRANCH" | grep -q .; then
  $GIT worktree add "$WORKTREE_PATH" "$BRANCH"
else
  $GIT worktree add "$WORKTREE_PATH" -b "$BRANCH"
fi

# Run the project's worktree-setup hook if it defines one (edrolo: symlinks + per-checkout config).
if mise -C "$ROOT" task info worktree_setup >/dev/null 2>&1; then
  mise -C "$ROOT" run worktree_setup "$WORKTREE_PATH"
fi
"""

[tasks.remove_worktree]
description = "Remove a git worktree of the current project"
usage = '''
arg "<branch>" help="Worktree to remove"
complete "branch" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename 2>/dev/null"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"
git -C "$ROOT" worktree remove --force "$WORKTREES_DIR/{{ usage.branch }}"
"""

[tasks.list_worktrees]
description = "List git worktrees of the current project"
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
git -C "$ROOT" worktree list
"""

[tasks.link_project_config]
description = "Link a worktree's mise.toml to its project's shared config if missing"
hide = true
usage = '''
arg "<root>" help="The project's main checkout"
arg "<path>" help="The worktree"
'''
run = """
set -eu
ROOT="{{ usage.root }}"
WT="{{ usage.path }}"
# Only a main checkout whose mise.toml is a symlink uses a shared, untracked config; a
# tracked mise.toml is already present in every worktree. Worktrees created with plain
# `git worktree add` skip worktree_setup and so miss the link.
[ -L "$ROOT/mise.toml" ] || exit 0
[ "$WT" != "$ROOT" ] || exit 0
# Older worktrees linked .venv to a shared venv that no longer exists; mise can't create
# the per-checkout venv over the dangling link.
if [ -L "$WT/.venv" ] && [ ! -e "$WT/.venv" ]; then
  rm "$WT/.venv"
  echo "removed dangling $WT/.venv link"
fi
if [ -e "$WT/mise.toml" ] || [ -L "$WT/mise.toml" ]; then
  exit 0
fi
TARGET=$(readlink "$ROOT/mise.toml")
case "$TARGET" in
  /*) ;;
  *) TARGET="$ROOT/$TARGET" ;;
esac
# Normalise without resolving symlinks, so the link names the shared path rather than
# wherever that currently points (e.g. the nix store).
TARGET="$(cd "$(dirname "$TARGET")" && pwd -L)/$(basename "$TARGET")"
ln -s "$TARGET" "$WT/mise.toml"
mise trust -q "$WT"
echo "linked $WT/mise.toml -> $TARGET"
"""

[tasks.clean_worktrees]
description = "Flag stale or merged worktrees of the current project and pick which to remove"
usage = '''
flag "--days <days>" default="14" help="Flag worktrees unused for more than this many days"
flag "--list" help="Print the flagged worktrees as JSON and exit without removing anything"
flag "--remove <names>" help="Remove these flagged worktrees (comma-separated directory names) without prompting"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
DAYS="{{ usage.days }}"
LIST="{{ usage.list }}"
REMOVE="{{ usage.remove }}"
HERE=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --show-toplevel)
G="git -C $ROOT"

# --prune drops remote-tracking refs for deleted branches, which "upstream deleted" relies on.
$G fetch --prune --quiet origin 2>/dev/null || echo "Warning: fetch failed; merge checks use possibly stale refs." >&2
BASE=$($G symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null || echo master)

NOW=$(date +%s)
FLAGGED=$(mktemp)
trap 'rm -f "$FLAGGED"' EXIT

# Porcelain records are blank-line separated; the first is the main checkout.
$G worktree list --porcelain | awk '
  /^worktree / { path = substr($0, 10); branch = ""; locked = 0 }
  /^branch /   { branch = substr($0, 19) }
  /^locked/    { locked = 1 }
  /^$/         { if (n++ && !locked) print path "|" branch; path = "" }
  END          { if (path != "" && n++ && !locked) print path "|" branch }
' > "$FLAGGED.all"
echo "Checking $(wc -l < "$FLAGGED.all" | tr -d ' ') worktrees against $BASE..." >&2

while IFS='|' read -r path branch; do
  [ "$path" = "$HERE" ] && continue
  reasons=""
  merged=""
  dirty=""
  if [ ! -d "$path" ]; then
    reasons="directory missing"
  else
    # Last use: newest of the HEAD commit, the index (rewritten by status/add/checkout) and
    # the HEAD reflog (commits, checkouts, resets).
    last=$(git -C "$path" log -1 --format=%ct HEAD)
    GD=$(git -C "$path" rev-parse --absolute-git-dir)
    for f in "$GD/index" "$GD/logs/HEAD"; do
      [ -e "$f" ] || continue
      m=$(stat -f %m "$f")
      [ "$m" -gt "$last" ] && last=$m
    done
    age=$(( (NOW - last) / 86400 ))
    [ "$age" -gt "$DAYS" ] && reasons="unused ${age}d"
    # --no-optional-locks: a plain status refreshes the index, which would reset its mtime.
    [ -n "$(git -C "$path" --no-optional-locks status --porcelain | head -1)" ] && dirty=1
  fi

  if [ -n "$branch" ]; then
    tip=$($G rev-parse "refs/heads/$branch")
    created=$($G reflog show --format=%H "refs/heads/$branch" 2>/dev/null | tail -1)
    # A branch with no commits since creation is trivially an ancestor of BASE; that is
    # not a merge.
    if [ "$tip" != "$created" ]; then
      if $G merge-base --is-ancestor "$tip" "$BASE"; then
        merged="merged into $BASE"
      else
        # Squash merges leave no ancestry. Collapse the branch into one commit on its
        # merge-base and ask git cherry whether BASE already has an equivalent patch.
        mb=$($G merge-base "$tip" "$BASE" || true)
        if [ -n "$mb" ]; then
          probe=$($G commit-tree "$tip^{tree}" -p "$mb" -m probe)
          case $($G cherry "$BASE" "$probe") in -*) merged="squash-merged into $BASE" ;; esac
        fi
      fi
    fi
    if [ "$($G for-each-ref --format='%(upstream:track)' "refs/heads/$branch")" = "[gone]" ]; then
      merged="${merged:+$merged, }upstream deleted"
    fi
  fi

  if [ -n "$merged" ]; then
    reasons="${reasons:+$reasons, }$merged"
  fi
  [ -n "$reasons" ] && echo "$path|$branch|$reasons|$merged|$dirty" >> "$FLAGGED"
done < "$FLAGGED.all"
rm -f "$FLAGGED.all"

if [ "$LIST" = "true" ]; then
  jq -R -s 'split("\\n") | map(select(length > 0) | split("|") | {
    name: (.[0] | split("/") | last), path: .[0], branch: .[1], reasons: .[2],
    merged: (.[3] != ""), dirty: (.[4] != "")
  })' "$FLAGGED"
  exit 0
fi

if [ ! -s "$FLAGGED" ]; then
  echo "Nothing to clean up."
  exit 0
fi

echo
{
  echo "WORKTREE|BRANCH|REASON|IF REMOVED"
  while IFS='|' read -r path branch reasons merged dirty; do
    if [ -n "$merged" ] && [ -n "$branch" ]; then
      action="worktree + branch deleted"
    else
      action="worktree deleted, branch kept"
    fi
    [ -n "$dirty" ] && action="$action; uncommitted changes lost"
    echo "$(basename "$path")|${branch:-detached}|$reasons|$action"
  done < "$FLAGGED"
} | column -t -s '|'
echo

if [ -n "$REMOVE" ]; then
  # Selection by name, as indices into $FLAGGED like the gum path below. Validate every
  # name before removing anything.
  SELECTED=""
  for name in $(echo "$REMOVE" | tr ',' ' '); do
    i=$(awk -F'|' -v n="$name" '{ k = split($1, p, "/") } p[k] == n { print NR; exit }' "$FLAGGED")
    if [ -z "$i" ]; then
      echo "Error: '$name' is not a flagged worktree; nothing removed." >&2
      exit 1
    fi
    SELECTED="$SELECTED$i
"
  done
else
  if ! ( : < /dev/tty ) 2>/dev/null; then
    echo "Error: choosing worktrees needs a terminal; nothing removed." >&2
    exit 1
  fi
  # Each option is "label|N": gum shows the label and prints N, the line in $FLAGGED.
  # --selected matches labels and is comma-separated, so labels must not contain commas.
  # Worktrees with uncommitted changes start deselected.
  set --
  PRESELECT=""
  i=0
  while IFS='|' read -r path branch reasons merged dirty; do
    i=$((i + 1))
    label=$(basename "$path" | tr ',' ' ')
    if [ -n "$dirty" ]; then
      label="$label  (uncommitted changes)"
    else
      PRESELECT="${PRESELECT:+$PRESELECT,}$label"
    fi
    set -- "$@" "$label|$i"
  done < "$FLAGGED"

  SELECTED=$(gum choose --no-limit --height 20 --label-delimiter '|' --selected "$PRESELECT" \\
    --header "Worktrees to remove (x toggles, ctrl+a toggles all, enter continues, esc aborts)" \\
    "$@" < /dev/tty) || { echo "Aborted; nothing removed."; exit 0; }
  COUNT=$(printf '%s' "$SELECTED" | grep -c . || true)
  if [ "$COUNT" -eq 0 ]; then
    echo "Nothing selected; nothing removed."
    exit 0
  fi
  if ! gum confirm --default=false "Remove $COUNT worktree(s)?" < /dev/tty; then
    echo "Aborted; nothing removed."
    exit 0
  fi
fi

i=0
while IFS='|' read -r path branch reasons merged dirty; do
  i=$((i + 1))
  printf '%s\\n' "$SELECTED" | grep -qx "$i" || continue
  if [ -d "$path" ]; then
    # --force: clean worktrees still hold ignored files (node_modules, .venv), and dirty
    # ones were explicitly selected.
    $G worktree remove --force "$path"
  else
    $G worktree prune
  fi
  echo "removed $(basename "$path")"
  WS=$(herdr workspace list 2>/dev/null | jq -r --arg n "$(basename "$path")" \\
    'first(.result.workspaces[] | select(.label == $n) | .workspace_id) // empty' || true)
  if [ -n "$WS" ]; then
    herdr workspace close "$WS" >/dev/null && echo "  closed herdr workspace $(basename "$path")"
  fi
  # -D: squash-merged branches aren't ancestors of BASE, so -d would refuse them.
  if [ -n "$merged" ] && [ -n "$branch" ]; then
    $G branch -D "$branch" >/dev/null && echo "  deleted branch $branch"
  fi
done < "$FLAGGED"
"""

#
# Agents
#

[tasks.kill_agent]
description = "Close the herdr workspace running the agent for a worktree"
usage = '''
arg "<worktree>" help="Worktree whose agent workspace to close"
complete "worktree" run="herdr workspace list 2>/dev/null | jq -r '.result.workspaces[].label' | sort -u"
'''
run = """
set -eu
WORKTREE="{{ usage.worktree }}"
DIR_NAME=$(echo "$WORKTREE" | tr '/' '-')

# Resolve the workspace id by label so it works regardless of what we're attached to.
TARGET=$(herdr workspace list | jq -r --arg n "$DIR_NAME" \
  'first(.result.workspaces[] | select(.label == $n) | .workspace_id) // empty')
if [ -z "$TARGET" ]; then
  echo "No agent workspace labelled '$DIR_NAME' found." >&2
  exit 1
fi
herdr workspace close "$TARGET"
"""

#
# Dev
#

[tasks.open_workspace]
description = "Find or create the herdr dev workspace for a project checkout or worktree"
hide = true
usage = '''
arg "<root>" help="The project's main checkout"
arg "[worktree]" help="Worktree to open (defaults to the main checkout)"
'''
run = """
set -eu
ROOT="{{ usage.root }}"
PROJECT=$(basename "$ROOT")
# Read WORKTREE_HOME straight from the project's own mise.toml (the documented contract).
# We parse the file rather than use `mise env`: a nested `mise` invoked from inside a running
# mise task does NOT re-resolve the project's env, so it returns nothing and we'd silently
# fall back to the default and misplace the worktree. Defaults to "worktrees/<project>".
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/$PROJECT}"

WORKTREE="{{ usage.worktree }}"
if [ -z "$WORKTREE" ]; then
  WORKTREE_PATH="$ROOT"
  LABEL="$PROJECT"
else
  LABEL=$(echo "$WORKTREE" | tr '/' '-')
  WORKTREE_PATH="$WORKTREES_DIR/$LABEL"
  # stdout is reserved for this task's result.
  if [ ! -d "$WORKTREE_PATH" ]; then
    ( cd "$ROOT" && mise run add_worktree "$WORKTREE" ) >&2
  fi
  mise run link_project_config "$ROOT" "$WORKTREE_PATH" >&2
fi

mise run herdr_server default >&2

# Reuse an existing dev workspace for this target rather than clobbering it. The workspace
# has a single tab: a shell cwd'd in the worktree (mise activates via the shell rc, so the
# project env is live).
WS=$(herdr workspace list | jq -r --arg n "$LABEL" \
  'first(.result.workspaces[] | select(.label == $n) | .workspace_id) // empty')
STATE=existing
if [ -z "$WS" ]; then
  CREATE=$(herdr workspace create --cwd "$WORKTREE_PATH" --label "$LABEL" --no-focus)
  WS=$(echo "$CREATE" | jq -r '.result.workspace.workspace_id')
  herdr tab rename "$(echo "$CREATE" | jq -r '.result.tab.tab_id')" agent >/dev/null
  # The command comes from the environment rather than a usage flag: usage values are
  # substituted into this script as text, so quotes inside a command would break it.
  if [ -n "${WORKSPACE_RUN:-}" ]; then
    herdr pane run "$(echo "$CREATE" | jq -r '.result.root_pane.pane_id')" "$WORKSPACE_RUN" >/dev/null
  fi
  STATE=created
fi
echo "$WS $STATE"
"""

[tasks.dev]
description = "Open a herdr dev workspace for a project/worktree"
usage = '''
arg "[worktree]" help="Worktree to work in (defaults to the project's main checkout)"
complete "worktree" run="R=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null); R=${R%/.git}; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename) | sort -u"
'''
run = """
set -eu
ROOT=$(git -C "$MISE_ORIGINAL_CWD" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || true
ROOT=${ROOT:+$(dirname "$ROOT")}
if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
  echo "Error: not inside a git project under ~/projects (cwd: $MISE_ORIGINAL_CWD)." >&2
  exit 1
fi
WORKTREE="{{ usage.worktree }}"
OUT=$(cd "$ROOT" && mise run open_workspace "$ROOT" ${WORKTREE:+"$WORKTREE"})
herdr workspace focus "${OUT%% *}" >/dev/null

# Attach this terminal to the session, unless we're already inside a herdr client — in that
# case the focus above already switched the view.
if [ -z "${HERDR_ENV:-}" ]; then
  herdr session attach default
fi
"""

[tasks.plan]
description = "Open the planning agent's herdr workspace in knowledge"
run = """
set -eu
ROOT="$MISE_CONFIG_ROOT/knowledge"
OUT=$(cd "$ROOT" && WORKSPACE_RUN="claude -n planning" mise run open_workspace "$ROOT")
herdr workspace focus "${OUT%% *}" >/dev/null
if [ -z "${HERDR_ENV:-}" ]; then
  herdr session attach default
fi
"""

#
# Tickets
#
# A ticket is a markdown file at knowledge/tickets/<repo>/<NNNN>_<slug>.md, where <repo> is a
# project directory under ~/projects. Its YAML frontmatter holds flat `key: value` fields:
# title, status (TO_DO | IN_PROGRESS | DONE), priority (1-3, 1 most important), and the
# optional jira, pr and session. knowledge/AGENTS.md documents the format for the planner.

[tasks.ticket_index]
description = "Print every ticket as a tab-separated row"
hide = true
run = """
set -eu
DIR=$(cd "$MISE_CONFIG_ROOT/knowledge/tickets" && pwd -P)
# Columns: repo path status priority jira pr session branch title. Empty fields print as
# "-" so that consumers splitting on tabs (column, read) don't collapse them.
for f in "$DIR"/*/*.md; do
  [ -e "$f" ] || continue
  awk -v path="$f" '
    NR == 1 { if ($0 != "---") exit; next }
    $0 == "---" { ok = 1; exit }
    {
      i = index($0, ":")
      if (!i) next
      k = substr($0, 1, i - 1)
      v = substr($0, i + 1)
      gsub(/^[ \t]+|[ \t]+$/, "", v)
      gsub(/^"|"$/, "", v)
      m[k] = v
    }
    END {
      if (!ok) exit
      n = split(path, p, "/")
      repo = p[n - 1]
      name = p[n]
      sub(/\\.md$/, "", name)
      # A Jira-linked ticket branches as <key>-<slug>, matching how Jira-linked branches are
      # already named; others use the ticket filename.
      if (m["jira"] != "") {
        slug = name
        sub(/^[0-9]+_/, "", slug)
        branch = tolower(m["jira"]) "-" slug
      } else {
        branch = name
      }
      gsub(/_/, "-", branch)
      split("status priority jira pr session", keys, " ")
      for (j = 1; j <= 5; j++) if (m[keys[j]] == "") m[keys[j]] = "-"
      print repo "\t" path "\t" m["status"] "\t" m["priority"] "\t" m["jira"] "\t" m["pr"] "\t" m["session"] "\t" branch "\t" m["title"]
    }
  ' "$f"
done
"""

[tasks.ticket_set]
description = "Set a frontmatter field in a ticket"
hide = true
usage = '''
arg "<path>" help="Ticket file"
arg "<key>" help="Field name"
arg "<value>" help="Field value"
'''
run = """
set -eu
F="{{ usage.path }}"
awk -v k="{{ usage.key }}" -v v="{{ usage.value }}" '
  NR == 1 { print; next }
  !end && $0 == "---" { if (!set) print k ": " v; end = 1; print; next }
  !end && index($0, k ":") == 1 { print k ": " v; set = 1; next }
  { print }
' "$F" > "$F.tmp"
mv "$F.tmp" "$F"
"""

[tasks.tickets]
description = "List tickets by status and priority"
usage = '''
flag "--repo <repo>" help="Only this repo's tickets"
flag "--all" help="Include DONE tickets"
'''
run = """
set -eu
TAB=$(printf '\\t')
{
  echo "TICKET${TAB}STATUS${TAB}P${TAB}JIRA${TAB}PR${TAB}BRANCH${TAB}TITLE"
  mise run ticket_index | awk -F'\\t' -v repo="{{ usage.repo }}" -v all="{{ usage.all }}" '
    (repo == "" || $1 == repo) && (all == "true" || $3 != "DONE") {
      n = split($2, p, "/")
      id = p[n]
      sub(/_.*/, "", id)
      pr = $6
      if (pr != "-") { sub(/.*\\//, "", pr); pr = "#" pr }
      rank = ($3 == "IN_PROGRESS") ? 0 : ($3 == "TO_DO") ? 1 : 2
      print rank "\\t" $4 "\\t" $1 "/" id "\\t" $3 "\\t" $4 "\\t" $5 "\\t" pr "\\t" $8 "\\t" $9
    }' | sort -t "$TAB" -k1,1n -k2,2n -k3,3 | cut -f3-
} | column -t -s "$TAB"
"""

[tasks.ticket_next]
description = "Print the path of the next ticket to work on (highest-priority TO_DO)"
usage = '''
flag "--repo <repo>" help="Only consider this repo's tickets"
'''
run = """
set -eu
TAB=$(printf '\\t')
NEXT=$(mise run ticket_index | awk -F'\\t' -v repo="{{ usage.repo }}" '
  $3 == "TO_DO" && (repo == "" || $1 == repo) {
    p = ($4 == "-") ? 3 : $4
    n = split($2, f, "/")
    print p "\\t" f[n] "\\t" $2
  }' | sort -t "$TAB" -k1,1n -k2,2 | head -1 | cut -f3)
if [ -z "$NEXT" ]; then
  echo "No TO_DO tickets." >&2
  exit 1
fi
echo "$NEXT"
"""

[tasks.work_ticket]
description = "Start (or resume) a Claude Code agent on a ticket in its own worktree and herdr workspace"
usage = '''
arg "[ticket]" help="Ticket path, <repo>/<number> or <number> (defaults to the next TO_DO ticket)"
flag "--repo <repo>" help="Pick the next ticket from this repo only"
flag "--attach" help="Switch to the agent's workspace once started"
complete "ticket" run="mise run ticket_index 2>/dev/null | awk -F'\\t' '$3 != \"DONE\" { n = split($2, p, \"/\"); sub(/\\.md$/, \"\", p[n]); print $1 \"/\" p[n] }'"
'''
run = """
set -eu
TICKETS=$(cd "$MISE_CONFIG_ROOT/knowledge/tickets" && pwd -P)
TAB=$(printf '\\t')
ARG="{{ usage.ticket }}"
REPO="{{ usage.repo }}"

if [ -z "$ARG" ]; then
  P=$(mise run ticket_next ${REPO:+--repo "$REPO"})
elif [ -f "$ARG" ]; then
  P=$(cd "$(dirname "$ARG")" && echo "$(pwd -P)/$(basename "$ARG")")
else
  MATCHES=""
  for f in "$TICKETS"/$ARG*.md "$TICKETS"/${REPO:-*}/$ARG*.md; do
    [ -e "$f" ] && MATCHES="$MATCHES$f
"
  done
  MATCHES=$(printf '%s' "$MATCHES" | sort -u)
  if [ "$(printf '%s' "$MATCHES" | grep -c .)" -ne 1 ]; then
    echo "Error: '$ARG' must match exactly one ticket; matched:" >&2
    printf '%s\\n' "${MATCHES:-  (none)}" >&2
    exit 1
  fi
  P=$MATCHES
fi

ROW=$(mise run ticket_index | awk -F'\\t' -v p="$P" '$2 == p')
if [ -z "$ROW" ]; then
  echo "Error: $P is not a ticket (no frontmatter, or not under $TICKETS/<repo>/)." >&2
  exit 1
fi
IFS="$TAB" read -r REPO P STATUS PRIO JIRA PR SESSION BRANCH TITLE <<EOF
$ROW
EOF

ROOT="$MISE_CONFIG_ROOT/$REPO"
if ! git -C "$ROOT" rev-parse --git-dir >/dev/null 2>&1; then
  echo "Error: no git project at $ROOT for ticket $P." >&2
  exit 1
fi
if [ "$STATUS" = DONE ]; then
  echo "Error: $P is already DONE." >&2
  exit 1
fi

# --add-dir lets the agent read its ticket and write follow-up tickets outside the worktree.
if [ "$STATUS" = IN_PROGRESS ] && [ "$SESSION" != - ]; then
  CMD="claude --resume $SESSION --add-dir $TICKETS"
else
  SESSION=$(uuidgen | tr '[:upper:]' '[:lower:]')
  PROMPT="Complete the ticket at $P. Keep to its scope. If the work grows, write a new TO_DO ticket in the same directory instead of expanding this one. Leave its status, pr and session fields alone. When the acceptance criteria are met, commit, push the branch and open a PR."
  CMD="claude --session-id $SESSION -n $BRANCH --add-dir $TICKETS '$PROMPT'"
fi

OUT=$(cd "$ROOT" && WORKSPACE_RUN="$CMD" mise run open_workspace "$ROOT" "$BRANCH")
WS=${OUT%% *}
if [ "${OUT#* }" = existing ]; then
  echo "Workspace $BRANCH already exists; left it as is." >&2
else
  mise run ticket_set "$P" status IN_PROGRESS
  mise run ticket_set "$P" session "$SESSION"
  echo "Started $REPO/$(basename "$P" .md) in workspace $BRANCH: $TITLE"
fi

if [ "{{ usage.attach }}" = true ]; then
  herdr workspace focus "$WS" >/dev/null
  if [ -z "${HERDR_ENV:-}" ]; then
    herdr session attach default
  fi
fi
"""

[tasks.ticket_sync]
description = "Record the PR of each in-progress ticket and mark tickets whose PR merged as DONE"
run = """
set -eu
TAB=$(printf '\\t')
# Nested commands read from /dev/null so they don't consume the loop's input.
mise run ticket_index | while IFS="$TAB" read -r repo path status prio jira pr session branch title; do
  [ "$status" = IN_PROGRESS ] || continue
  FOUND=$(cd "$MISE_CONFIG_ROOT/$repo" && gh pr list --head "$branch" --state all --limit 1 \\
    --json url,state --jq 'first // empty | "\\(.url) \\(.state)"' < /dev/null) || {
    echo "$repo/$branch: gh pr list failed" >&2
    continue
  }
  [ -n "$FOUND" ] || continue
  URL=${FOUND% *}
  STATE=${FOUND#* }
  if [ "$pr" != "$URL" ]; then
    mise run ticket_set "$path" pr "$URL" < /dev/null
    echo "$repo/$branch: PR $URL"
  fi
  if [ "$STATE" = MERGED ]; then
    mise run ticket_set "$path" status DONE < /dev/null
    echo "$repo/$branch: DONE"
  fi
done
"""

#
# Herdr
#

[tasks.herdr_server]
description = "Ensure a headless herdr server is running for a session"
hide = true
usage = '''
arg "<session>" help="herdr session name"
'''
run = """
set -eu
SESSION="{{ usage.session }}"
running() { herdr --session "$SESSION" status server 2>/dev/null | grep -q 'status: running'; }
running && exit 0
# Start from a clean login env. Panes inherit the server's env, so starting it with this
# task's env (mise state, a project's [env], tool PATHs) would leak into every pane and
# stop `mise activate` there from tracking the pane's own directory.
env -i HOME="$HOME" USER="$USER" LOGNAME="${LOGNAME:-$USER}" SHELL="${SHELL:-/bin/zsh}" \\
  TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-en_US.UTF-8}" SSH_AUTH_SOCK="${SSH_AUTH_SOCK:-}" \\
  /bin/zsh -lc 'nohup herdr --session "$1" server >/dev/null 2>&1 &' _ "$SESSION"
for _ in $(seq 1 50); do
  running && exit 0
  sleep 0.1
done
echo "Error: herdr server for session '$SESSION' did not start." >&2
exit 1
"""

#
# App
#

# The Edrolo app stack runs in its own herdr session (edrolo-app), one tab per service.
# Services bind fixed ports, so only one checkout's stack runs at a time.

[tasks.start_edrolo]
description = "Start the Edrolo app stack for a worktree in the edrolo-app herdr session"
usage = '''
arg "[worktree]" help="Worktree to run (defaults to the main checkout)"
complete "worktree" run="R=$HOME/projects/edrolo; (git -C \"$R\" branch --format='%(refname:short)'; git -C \"$R\" worktree list --porcelain 2>/dev/null | sed -n 's|^worktree ||p' | tail -n +2 | xargs -n1 basename) | sort -u"
'''
run = """
set -eu
SESSION=edrolo-app
ROOT="$MISE_CONFIG_ROOT/edrolo"
WT_HOME=$(sed -n 's/^[[:space:]]*WORKTREE_HOME[[:space:]]*=[[:space:]]*//p' "$ROOT/mise.toml" 2>/dev/null | head -1 | tr -d '\\" ')
WORKTREES_DIR="$MISE_CONFIG_ROOT/${WT_HOME:-worktrees/edrolo}"

WORKTREE="{{ usage.worktree }}"
if [ -z "$WORKTREE" ]; then
  WORKTREE_PATH="$ROOT"
  LABEL=edrolo
else
  LABEL=$(echo "$WORKTREE" | tr '/' '-')
  WORKTREE_PATH="$WORKTREES_DIR/$LABEL"
  if [ ! -d "$WORKTREE_PATH" ]; then
    ( cd "$ROOT" && mise run add_worktree "$WORKTREE" )
  fi
fi
if [ ! -d "$WORKTREE_PATH/tod_project" ]; then
  echo "Error: not an Edrolo checkout (no tod_project under '$WORKTREE_PATH')." >&2
  exit 1
fi

mise run herdr_server "$SESSION"
H="herdr --session $SESSION"
OLD=$($H workspace list | jq -r '.result.workspaces[].workspace_id')

# label|cwd|command. The first service takes the workspace's initial tab.
SERVICES="docker|$HOME|lazydocker
django|$WORKTREE_PATH/tod_project|mise exec -- ./manage.py runserver
vite|$WORKTREE_PATH/tod_project/frontend|pnpm dev:no-gen
react|$WORKTREE_PATH/tod_project/tod_django/react|yarn install && yarn run dev"

WS=
while IFS='|' read -r label cwd cmd; do
  if [ -z "$WS" ]; then
    CREATE=$($H workspace create --cwd "$cwd" --label "$LABEL" --no-focus)
    WS=$(echo "$CREATE" | jq -r '.result.workspace.workspace_id')
    $H tab rename "$(echo "$CREATE" | jq -r '.result.tab.tab_id')" "$label" >/dev/null
    PANE=$(echo "$CREATE" | jq -r '.result.root_pane.pane_id')
  else
    PANE=$($H tab create --workspace "$WS" --cwd "$cwd" --label "$label" --no-focus \\
      | jq -r '.result.root_pane.pane_id')
  fi
  $H pane run "$PANE" "$cmd"
  echo "started $label ($LABEL)"
done <<EOF
$SERVICES
EOF

# Close the previous stack only after the new workspace exists, so the session never
# drops to zero workspaces.
for w in $OLD; do $H workspace close "$w" >/dev/null 2>&1 || true; done
$H workspace focus "$WS" >/dev/null

if [ -z "${HERDR_ENV:-}" ] && [ -t 0 ]; then
  herdr session attach "$SESSION"
else
  echo "Attach with: herdr session attach $SESSION"
fi
"""

[tasks.stop_edrolo]
description = "Stop the Edrolo app stack (the edrolo-app herdr session)"
run = """
set -eu
if herdr session list | awk '$1 == "edrolo-app" && $2 == "running" { found = 1 } END { exit !found }'; then
  herdr session stop edrolo-app
else
  echo "edrolo-app is not running."
fi
"""

[tasks.edrolo_logs]
description = "Print recent output of an Edrolo app service running in the edrolo-app herdr session"
usage = '''
arg "<service>" help="Service tab to read" {
  choices "docker" "django" "vite" "react"
}
flag "--lines <lines>" default="80" help="Number of lines to print"
'''
run = """
set -eu
H="herdr --session edrolo-app"
if ! $H status server 2>/dev/null | grep -q 'status: running'; then
  echo "edrolo-app is not running; start it with: mise run start_edrolo [worktree]" >&2
  exit 1
fi
TAB=$($H tab list | jq -r --arg l "{{ usage.service }}" \\
  'first(.result.tabs[] | select(.label == $l) | .tab_id) // empty')
PANE=$($H pane list | jq -r --arg t "$TAB" \\
  'first(.result.panes[] | select(.tab_id == $t) | .pane_id) // empty')
if [ -z "$PANE" ]; then
  echo "No {{ usage.service }} tab in edrolo-app." >&2
  exit 1
fi
CWD=$($H pane list | jq -r --arg p "$PANE" '.result.panes[] | select(.pane_id == $p) | .cwd')
echo "== {{ usage.service }} ($CWD)"
$H pane read "$PANE" --source recent --lines "{{ usage.lines }}"
"""
